<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status Locker</title>
<script>if (!sessionStorage.getItem('sl-sesion')) location.replace('login.html');</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link href="css/status-locker.css" rel="stylesheet">
<link href="css/extra.css" rel="stylesheet">
</head>
<body>
<main class="container py-4 py-md-5">
  <header class="mb-4 d-flex flex-wrap align-items-start justify-content-between gap-3">
    <div>
      <h1 class="mb-1">Status Locker</h1>
      <p class="mb-0 text-secondary">1,008 lockers. Toca un estado para filtrar y un locker para ver su información.</p>
    </div>
    <div class="sesion" id="sesion"></div>
  </header>

  <!-- Leyenda con conteos (también filtra) -->
  <section class="row g-2 mb-4" id="leyenda" aria-label="Estados de locker"></section>

  <!-- Hombres / Mujeres -->
  <ul class="nav nav-pills mb-3" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#p-h" type="button" role="tab">Hombres · 530</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" data-bs-toggle="pill" data-bs-target="#p-m" type="button" role="tab">Mujeres · 478</button>
    </li>
  </ul>
  <div class="tab-content">
    <div class="tab-pane fade show active" id="p-h" role="tabpanel"><div class="wall"><div class="grid-l" id="g-h"></div></div></div>
    <div class="tab-pane fade" id="p-m" role="tabpanel"><div class="wall"><div class="grid-l" id="g-m"></div></div></div>
  </div>
</main>

<!-- Tarjeta de información del locker -->
<aside class="tarjeta" id="tarjeta" aria-live="polite" hidden></aside>

<!-- Ventana para cambiar el estado (solo dueño) -->
<div class="modal fade" id="modalEditar" tabindex="-1" aria-labelledby="modalTitulo" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title fs-4" id="modalTitulo">Locker</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <label for="selEstado" class="form-label">Estado</label>
        <select id="selEstado" class="form-select mb-3"></select>
        <div id="campos"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-dark" id="btnGuardar">Guardar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/status-locker.js?v=2"></script>
</body>
</html>
<script src="js/status-locker.js"></script>
<script src="js/reporte.js"></script>
