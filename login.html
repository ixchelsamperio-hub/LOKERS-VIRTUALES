<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · Status Locker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link href="css/status-locker.css" rel="stylesheet">
<link href="css/extra.css" rel="stylesheet">
</head>
<body class="login-body">

<main class="login-card">
  <h1 class="mb-1">Status Locker</h1>
  <p class="text-secondary mb-3">Inicia sesión para continuar.</p>

  <div class="btn-group w-100 mb-3" role="group" aria-label="Tipo de cuenta">
    <input type="radio" class="btn-check" name="rol" id="rol-usuario" value="usuario" checked>
    <label class="btn btn-outline-dark" for="rol-usuario">Usuario (cliente)</label>

    <input type="radio" class="btn-check" name="rol" id="rol-dueno" value="dueno">
    <label class="btn btn-outline-dark" for="rol-dueno">Dueño</label>
  </div>

  <form id="form" novalidate>
    <div class="mb-3">
      <label class="form-label" for="correo">Correo electrónico</label>
      <input class="form-control" type="email" id="correo" autocomplete="email" placeholder="nombre@correo.com">
      <div class="invalid-feedback">Escribe un correo válido.</div>
    </div>

    <div class="mb-3">
      <label class="form-label" for="nombre">Nombre completo</label>
      <input class="form-control" type="text" id="nombre" autocomplete="name" placeholder="Nombre y apellidos">
      <div class="invalid-feedback">Escribe tu nombre y al menos un apellido.</div>
    </div>

    <div class="mb-3">
      <label class="form-label" for="curp">CURP</label>
      <input class="form-control text-uppercase" type="text" id="curp" maxlength="18" placeholder="18 caracteres">
      <div class="invalid-feedback">La CURP debe tener 18 caracteres con el formato correcto.</div>
    </div>

    <p class="small text-secondary mb-2">Captura tu RFC, tu número de empleado, o ambos.</p>

    <div class="row g-2 mb-3">
      <div class="col-12 col-sm-6">
        <label class="form-label" for="rfc">RFC</label>
        <input class="form-control text-uppercase" type="text" id="rfc" maxlength="13" placeholder="12 o 13 caracteres">
        <div class="invalid-feedback">RFC no válido.</div>
      </div>
      <div class="col-12 col-sm-6">
        <label class="form-label" for="empleado">Número de empleado</label>
        <input class="form-control" type="text" id="empleado" maxlength="15" placeholder="Ej. 12345">
        <div class="invalid-feedback">Número no válido.</div>
      </div>
    </div>

    <div class="alert alert-danger py-2 d-none" id="error" role="alert"></div>

    <button class="btn btn-dark w-100 btn-lg" type="submit">Entrar</button>
  </form>
</main>

<script src="js/login.js"></script>
</body>
</html>
